[project]
name = "blank-app-template"
version = "0.1.0"
description = "A simple Streamlit app template."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "streamlit>=1.61.1",
]

[tool.uv]
package = false

[theme]
base = "light"
backgroundColor = "#d4d4d4"
secondaryBackgroundColor = "#a1a1a1"
textColor = "#000000"
linkColor = "#0068C9"
codeBackgroundColor = "#F8F9FA"
